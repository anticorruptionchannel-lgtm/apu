[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apu"
version = "0.1.0"
description = "Anti-Corruption Platform - APU"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "anticorruptionchannel-lgtm"}]

dependencies = [
    "streamlit>=1.28.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
]

[project.urls]
Homepage = "https://github.com/anticorruptionchannel-lgtm/apu"
Repository = "https://github.com/anticorruptionchannel-lgtm/apu.git"

[tool.setuptools]
packages = ["apu"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
